name: ci

# Every gate is an arm of ./run.sh: the same command line runs locally and
# here. Arms and what each proves: docs/validation.md.
#
#   lint       tracked Python compiles, tracked JSON/notebooks parse
#   tests      the GNN conformance script's fail-closed type check and receipt labels
#   docs       relative links resolve, docs/ pages reachable from the index
#   plaintext  the plaintext integrity invariant (report only, writes nothing)
#   vfe        Chapters/test_vfe.jl, the VFE simulator's mathematics
#   gnn        the pinned GNN parser parses and type-checks the pinned exemplar
#
# Not covered: Chapters/VFE.jl is an interactive Pluto.jl notebook with no
# headless entry point, so no arm executes it; Chapters/test_vfe.jl
# re-implements the same model deterministically and covers its mathematics.
# Regenerating the plaintext from the PDF stays a reviewed, manual step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python arms use the standard library only, so this job runs them on the
  # runner's own python3 and installs nothing.
  plaintext:
    timeout-minutes: 15
    name: python arms (lint, tests, docs, plaintext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint tracked sources
        run: ./run.sh lint
      - name: Run the GNN conformance unit tests
        run: ./run.sh tests
      - name: Check documentation links and index coverage
        run: ./run.sh docs
      - name: Check the plaintext integrity invariant
        run: ./run.sh plaintext

  vfe:
    timeout-minutes: 15
    name: VFE regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1'
      - name: Run the VFE simulator regression tests
        run: ./run.sh vfe

  # Pin: .github/gnn-pin.json (schema gnn-importer-pin/v1). The arm reads the
  # pin, so no repository, tag or revision literal appears in this file.
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the pinned GNN parser
        run: ./run.sh gnn
